<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mentor Profile</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #f9fafb;
      color: #1f2937;
    }
    .flex {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      background-color: #1f2937;
      color: white;
      width: 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 1rem 0;
      position: fixed;
      height: 100vh;
    }
    .sidebar i {
      font-size: 1.4rem;
      cursor: pointer;
    }
    .main-content {
      margin-left: 4rem;
      padding: 2rem;
      width: 100%;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .header h1 {
      font-size: 1.75rem;
    }
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2rem;
      background-color: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }
    .profile-section img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
    }
    .profile-section h2 {
      margin: 0;
      font-size: 1.5rem;
    }
    .profile-section p {
      color: #6b7280;
      margin: 0.25rem 0;
    }
    .profile-details {
      margin-top: 2rem;
      width: 100%;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .detail-label {
      font-weight: 600;
    }
    @media (max-width: 768px) {
      .main-content {
        margin-left: 0;
        padding: 1rem;
      }
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        flex-direction: row;
        justify-content: space-around;
      }
      .profile-section {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="flex">
    <!-- Sidebar -->
    <aside class="sidebar">
      <i>&#9881;</i>
      <i>&#8853;</i>
      <i>&#128197;</i>
      <i>&#128100;</i>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="header">
        <h1>Mentor Profile</h1>
      </header>

      <section class="profile-section">
        <img src="https://storage.googleapis.com/a1aa/image/TC8VxjVIoT85T0zd6EPMahoGvOex3oxolMJnQ3UpDWc.jpg" alt="Mentor Photo">
        <h2>Riley Pesca</h2>
        <p>Senior Mentor, UI/UX & Frontend Development</p>
        <p>Member since: 2022</p>

        <div class="profile-details">
          <div class="detail-row">
            <span class="detail-label">Email:</span>
            <span>riley.pesca@tutoringhub.com</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Subjects:</span>
            <span>HTML, CSS, UI/UX Design</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Experience:</span>
            <span>5+ years in web design mentoring</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Average Rating:</span>
            <span>4.8 / 5.0</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Availability:</span>
            <span>Mon–Fri, 2PM–6PM</span>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
